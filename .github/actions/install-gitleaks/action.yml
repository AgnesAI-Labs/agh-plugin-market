name: Install pinned Gitleaks
description: Install the checksum-verified Linux x64 Gitleaks release for market review.
runs:
  using: composite
  steps:
    - name: Install Gitleaks v8.30.1
      shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/gitleaks.tar.gz"
        curl --fail --silent --show-error --location --max-time 60 \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          -o "$archive"
        printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$archive" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/market-bin"
        tar -xzf "$archive" -C "$RUNNER_TEMP/market-bin" gitleaks
        echo "$RUNNER_TEMP/market-bin" >> "$GITHUB_PATH"
