name: Market code review (report only)

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: ['ci/**']
    paths:
      - '.github/workflows/code-review.yml'
      - '.github/actions/install-gitleaks/action.yml'
      - 'tools/review-code.mjs'
      - 'tools/code-review-rules*.yml'
      - 'tools/code-review-rules.test.*'

permissions: {}

concurrency:
  group: market-code-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.repository == 'AgnesAI-Labs/agh-plugin-market'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.review.outputs.outcome }}
    steps:
      # Only trusted code and configuration are checked out on PR events.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: ./.github/actions/install-gitleaks
      - name: Analyze pinned release code without executing it
        id: review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.number }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          if [[ $GITHUB_EVENT_NAME == pull_request_target ]]; then
            [[ $PR_NUMBER =~ ^[0-9]+$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ && $BASE_SHA =~ ^[0-9a-f]{40}$ ]]
            if ! git -c http.followRedirects=false fetch --no-tags --no-recurse-submodules origin "refs/pull/$PR_NUMBER/head" >/dev/null 2>&1 ||
               [[ $(git rev-parse FETCH_HEAD) != "$HEAD_SHA" ]]; then
              printf '## Code review: incomplete\n\nCould not verify the PR revision.\n' | tee -a "$GITHUB_STEP_SUMMARY"
              echo 'outcome=incomplete' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            args=("$BASE_SHA" "$HEAD_SHA")
          else
            args=(--all "$HEAD_SHA")
          fi
          node tools/review-code.mjs "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  report:
    if: always() && !cancelled() && github.repository == 'AgnesAI-Labs/agh-plugin-market' && github.event_name == 'pull_request_target'
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Link the advisory report on the PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ needs.analyze.outputs.outcome }}
        run: |
          set -euo pipefail
          [[ $HEAD_SHA =~ ^[0-9a-f]{40}$ ]]
          case "$OUTCOME" in
            clear) text='Report only: no findings from the configured rules' ;;
            findings) text='Report only: behavioral findings need a closer look' ;;
            not-applicable) text='Report only: no applicable release code' ;;
            *) text='Report only: review coverage incomplete' ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f context='market / code-review' -f state=success -f description="$text" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
