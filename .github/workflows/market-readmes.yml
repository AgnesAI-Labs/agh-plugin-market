name: Market README sync

on:
  # Any trusted main push can reconcile a candidate that became stale mid-run.
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    if: >-
      github.repository == 'AgnesAI-Labs/agh-plugin-market' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
       github.event_name == 'workflow_run' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: market-readme-sync
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # Resolve main after acquiring the shared lock, not from the triggering event.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Generate and validate a README-only candidate
        id: generate
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          node tools/validate-index.mjs
          node tools/sync-readmes.mjs
          if [[ -n $(git status --porcelain=v1 --untracked-files=all -- . ':(exclude)README.md' ':(exclude)README.zh-CN.md') ]]; then
            echo '::error::The README generator changed files outside the generated READMEs.'
            exit 1
          fi
          git add -- README.md README.zh-CN.md
          if git diff --cached --quiet; then
            echo 'The market README tables are already up to date.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'docs: sync market README tables'
          head=$(git rev-parse HEAD)
          node tools/validate-index.mjs "$base" "$head"
          printf 'base=%s\nhead=%s\n' "$base" "$head" >> "$GITHUB_OUTPUT"
      - name: Open and merge the validated README sync PR
        if: steps.generate.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          BASE_SHA: ${{ steps.generate.outputs.base }}
          HEAD_SHA: ${{ steps.generate.outputs.head }}
        run: bash tools/publish-readmes.sh "$BASE_SHA" "$HEAD_SHA"
