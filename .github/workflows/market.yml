name: Market index

on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  validate-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # On PRs the workflow and validator come from the trusted base. Never check out
      # the contributor's tree: read only the catalog and README blobs at its immutable SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Validate main
        if: github.event_name == 'push'
        run: node tools/validate-index.mjs
      - name: Validate PR and report on its head
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          report() {
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f context='market / validate-index' -f state="$1" -f description="$2" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          }
          report pending 'Validating the proposed market index and README tables'
          trap 'report failure "Market index or README validation failed; see workflow logs"' EXIT
          git fetch --no-tags --no-recurse-submodules --depth=1 origin "refs/pull/$PR_NUMBER/head"
          if [[ $(git rev-parse FETCH_HEAD) != "$HEAD_SHA" ]]; then
            echo 'The PR head moved; the new revision is checked separately.'
            exit 1
          fi
          node tools/validate-index.mjs "$BASE_SHA" "$HEAD_SHA"
          report success 'Market index, sources, and README tables are valid'
          trap - EXIT
