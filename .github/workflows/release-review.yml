name: Market release review (report only)

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  # Maintainers can rehearse the scanner on an in-repository CI branch before rollout.
  push:
    branches: ['ci/**']
    paths: ['.github/workflows/release-review.yml', 'tools/review-release.mjs', 'tools/review-gitleaks.toml']

permissions:
  contents: read

concurrency:
  group: market-release-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-release:
    if: github.repository == 'AgnesAI-Labs/agh-plugin-market'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pinned Gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$archive"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/market-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/market-bin" gitleaks
          echo "$RUNNER_TEMP/market-bin" >> "$GITHUB_PATH"
      - name: Review release data without running contributor code
        id: review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.number }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          if [[ $GITHUB_EVENT_NAME == pull_request_target ]]; then
            [[ $PR_NUMBER =~ ^[0-9]+$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ && $BASE_SHA =~ ^[0-9a-f]{40}$ ]]
            git -c http.followRedirects=false fetch --no-tags --no-recurse-submodules origin "refs/pull/$PR_NUMBER/head"
            if [[ $(git rev-parse FETCH_HEAD) != "$HEAD_SHA" ]]; then
              echo 'The PR head moved; the new revision is reviewed separately.'
              exit 1
            fi
            args=("$BASE_SHA" "$HEAD_SHA" "$GITHUB_EVENT_PATH")
          else
            args=(--all "$HEAD_SHA")
          fi
          printf 'Reviewer: %s\n\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          node tools/review-release.mjs "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish advisory status on the PR head
        if: always() && !cancelled() && github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ steps.review.outputs.outcome }}
        run: |
          set -euo pipefail
          [[ $HEAD_SHA =~ ^[0-9a-f]{40}$ ]]
          case "$OUTCOME" in
            passed) state=success; description='Report only: no findings from the configured checks' ;;
            needs-review) state=failure; description='Report only: manual review recommended' ;;
            failed) state=failure; description='Report only: release findings require attention' ;;
            *) state=error; description='Report only: review incomplete' ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f context='market / review-release' -f state="$state" -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
